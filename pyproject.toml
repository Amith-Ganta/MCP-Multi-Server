[project]
name = "mcp-client"
version = "0.1.0"
description = "A multi-server MCP chat client (CLI + Streamlit) with math, expense, and animation tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.1",
    "langchain>=1.3.4",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "truststore>=0.10.4",
]
